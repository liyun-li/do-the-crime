// ---------- data ----------
async function load(){if(D)return true;show('loading');$('loadMsg').textContent=t().load;$('retryBtn').hidden=true;
 try{const r=await fetch('curated.json',{cache:'no-cache'});if(!r.ok)throw 0;D=await r.json();return true}catch(e){$('loadMsg').textContent=t().fail;$('retryBtn').hidden=false;return false}}
function rng(seed){let h=1779033703^seed.length;for(let i=0;i<seed.length;i++){h=Math.imul(h^seed.charCodeAt(i),3432918353);h=h<<13|h>>>19}
 return()=>{h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return((h^=h>>>16)>>>0)/4294967296}}
const HARD=new Set(['firearm','drugs','violent','threat','theft']),SOFT=new Set(['fraud','tax','covid','health','corruption','crypto','cyber','wildlife','mail','other','air','sport']);
const val=c=>c.k==='life'?2400:Math.max(c.m,1);
function band(s){return s<3?[3,99]:s<6?[2,6]:s<10?[1.5,3]:[1.2,2]}
function challenger(champ,streak,R,seen){const [lo,hi]=band(streak),v=val(champ);
 let cand=POOL.filter(c=>!seen.has(c.id)&&c.id!==champ.id&&(c.k==='life'?champ.k!=='life':true)).filter(c=>{const r=Math.max(val(c),v)/Math.min(val(c),v);return r>=lo&&r<=hi&&!(c.k==='life'&&champ.k==='life')});
 if(cand.length<4)cand=POOL.filter(c=>!seen.has(c.id)&&c.id!==champ.id&&Math.max(val(c),v)/Math.min(val(c),v)>=1.2);
 // keep higher/lower balanced, prefer a different category, and at higher streaks prefer counterintuitive pairs
 const up=R()<.5;let side=cand.filter(c=>(val(c)>v)===up);if(side.length)cand=side;
 const diff=cand.filter(c=>c.g!==champ.g);if(diff.length&&R()<.97)cand=diff;
 if(streak<4&&HARD.has(champ.g)&&R()<.8){const sf=cand.filter(c=>SOFT.has(c.g));if(sf.length)cand=sf}
 if(R()<(streak>=4?.5:.3)){const cx=cand.filter(c=>{const big=val(c)>v?c:champ,small=big===c?champ:c;return SOFT.has(big.g)&&HARD.has(small.g)});if(cx.length)cand=cx}
 // spread categories: weight down the very common ones
 const cnt={};for(const c of cand)cnt[c.g]=(cnt[c.g]||0)+1;const w=cand.map(c=>1/Math.sqrt(cnt[c.g]));let s=w.reduce((a,b)=>a+b,0)*R();
 for(let i=0;i<cand.length;i++){s-=w[i];if(s<=0)return cand[i]}return cand[cand.length-1]}
function poolFor(mode){const all=D.cases;const tr=all.filter(c=>c.zc);
 if(mode==='daily'){const d=today();return tr.filter(c=>c.a<d)}
 return L==='en'?all:tr}
function newRun(mode){POOL=poolFor(mode);const seed=mode==='daily'?'dtc-'+today():String(Math.random());const R=rng(seed);
 let firsts=POOL.filter(c=>c.k==='prison'&&c.m>=12&&c.m<=120);if(R()<.7)firsts=firsts.filter(c=>SOFT.has(c.g));const champ=firsts[Math.floor(R()*firsts.length)];const seen=new Set([champ.id]);
 run={mode,seed,R,a:champ,b:null,streak:0,seen,hist:[],picked:null,ids:[champ.id]};run.b=challenger(champ,0,R,seen);seen.add(run.b.id);run.ids.push(run.b.id);save()}
function save(){if(!run)return;localStorage.setItem('dtc_run',JSON.stringify({mode:run.mode,seed:run.seed,streak:run.streak,ids:run.ids,hist:run.hist,day:today()}))}
// ---------- render ----------
function fmt(c,m){const S=t();if(c.k==='life'&&m===undefined)return S.life;if(c.k==='probation')return S.prob;if(c.dy)return S.dy(m===undefined?c.dy:Math.max(1,Math.round(m/c.m*c.dy)));m=m===undefined?c.m:m;m=Math.round(m);
 return m<24?S.mo(m):S.ym(Math.floor(m/12),m%12)}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function txt(c){return L==='en'||!c.zc?{s:c.s,c:c.c}:{s:c.zs||'',c:c.zc}}
function card(id,c,known){const x=txt(c),S=t();const meta=[x.s,c.y,stateName(c.st)].filter(Boolean).join(' · ');
 const el=$(id==='A'?'cA':'cB'),p=$(id==='A'?'pA':'pB');el.classList.toggle('known',known);
 p.innerHTML=`<span class="meta">${esc(meta)}</span><span class="crime">${esc(x.c.charAt(0).toUpperCase()+x.c.slice(1))}</span><span class="time"><span class="lbl">${S.known}</span><span class="num${known?'':' q2'}">${known?esc(fmt(c)):'?'}</span></span>`;
 p.setAttribute('aria-label',`${x.c}. ${meta}. ${S.known} ${known?fmt(c):'?'}`)}
const ST={'Florida':'佛羅里達','Texas':'德州','California':'加州','New York':'紐約','Montana':'蒙大拿','South Dakota':'南達科他','Massachusetts':'麻州','District of Columbia':'華府','Virginia':'維吉尼亞','Indiana':'印第安納','Iowa':'愛荷華','Louisiana':'路易斯安那','Connecticut':'康乃狄克','Ohio':'俄亥俄','Pennsylvania':'賓州','Georgia':'喬治亞','North Carolina':'北卡','South Carolina':'南卡','Tennessee':'田納西','Kentucky':'肯塔基','Alabama':'阿拉巴馬','Mississippi':'密西西比','Arkansas':'阿肯色','Missouri':'密蘇里','Kansas':'堪薩斯','Nebraska':'內布拉斯加','Oklahoma':'奧克拉荷馬','Colorado':'科羅拉多','Utah':'猶他','Nevada':'內華達','Arizona':'亞利桑那','New Mexico':'新墨西哥','Washington':'華盛頓州','Oregon':'奧勒岡','Idaho':'愛達荷','Wyoming':'懷俄明','North Dakota':'北達科他','Minnesota':'明尼蘇達','Wisconsin':'威斯康辛','Michigan':'密西根','Illinois':'伊利諾','New Jersey':'紐澤西','Delaware':'德拉瓦','Maryland':'馬里蘭','West Virginia':'西維吉尼亞','Maine':'緬因','New Hampshire':'新罕布夏','Vermont':'佛蒙特','Rhode Island':'羅德島','Alaska':'阿拉斯加','Hawaii':'夏威夷','Puerto Rico':'波多黎各','Guam':'關島','Virgin Islands':'美屬維京群島','Northern Mariana Islands':'北馬里亞納'};
const stateName=s=>!s?'':L==='en'?s:(ST[s]||s);
function paint(keep){const S=t();card('A',run.a,true);card('B',run.b,!!run.picked);
 for(const k of['A','B']){const el=$('c'+k);el.classList.remove('win','lose','good','bad');el.querySelector('.stamp').className='stamp';el.querySelector('.stamp').textContent='';const old=el.querySelector('.src');if(old)old.remove()}
 $('pA').disabled=$('pB').disabled=!!run.picked;$('game').classList.toggle('wait',!run.picked);
 if(!run.picked){$('quip').className='quip hint';$('quip').textContent=S.hint}else reveal(true);bests()}
function show(id){for(const s of['start','game','loading','end'])$(s).classList.toggle('on',s===id);document.body.classList.toggle('ingame',id==='game');document.body.classList.toggle('atend',id==='end')}
function quip(a,b){const S=t().quips,big=val(a)>=val(b)?a:b,small=big===a?b:a,r=val(big)/val(small);
 if(big.k==='life')return S.life;if(small.k==='probation')return S.prob;if(SOFT.has(big.g)&&HARD.has(small.g))return S.soft;if(r>=5)return S.huge(Math.round(r));if(r<1.5)return S.close;
 const g=S.gen;return g[(a.id.charCodeAt(0)+b.id.charCodeAt(1))%g.length]}
let AC=null;function beep(f,d){if(!sound)return;try{AC=AC||new AudioContext();const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;o.type='square';g.gain.value=.04;o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
function count(el,c,done){const target=c.k==='life'?600:c.m;if(c.k==='probation'||matchMedia('(prefers-reduced-motion:reduce)').matches){el.textContent=fmt(c);done&&done();return}
 const t0=performance.now(),dur=900;let lastTick=0;(function step(now){const p=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-p,3),m=target*e;
  el.textContent=p<1?fmt({k:'prison',m:c.m,dy:c.dy},m):fmt(c);if(now-lastTick>70&&p<1){beep(300+600*e,.03);lastTick=now}
  if(p<1)requestAnimationFrame(step);else{done&&done()}})(t0)}
function choose(k){if(!run||run.picked||busy)return;const a=run.a,b=run.b,pickedA=k==='A';const aWins=val(a)>val(b);const ok=pickedA===aWins;
 run.picked=k;run.ok=ok;run.hist.push(ok?1:0);if(ok)run.streak++;
 const S=t();card('B',b,true);const num=$('pB').querySelector('.num');num.classList.remove('q2');busy=true;$('pA').disabled=$('pB').disabled=true;
 count(num,b,()=>{busy=false;reveal(false)});
 if(navigator.vibrate)try{navigator.vibrate(ok?20:[40,40,40])}catch(e){}
 if(!ok){const best=+localStorage.getItem('dtc_best')||0;if(run.mode!=='daily'&&run.streak>best)localStorage.setItem('dtc_best',run.streak);
  if(run.mode==='daily'){const dd=JSON.parse(localStorage.getItem('dtc_daily')||'{}');if(dd.d!==today())localStorage.setItem('dtc_daily',JSON.stringify({d:today(),s:run.streak}))}}
 else{const best=+localStorage.getItem('dtc_best')||0;if(run.mode!=='daily'&&run.streak>best)localStorage.setItem('dtc_best',run.streak)}
 save()}
function reveal(instant){const S=t(),a=run.a,b=run.b,ok=run.ok,k=run.picked;const aWins=val(a)>val(b);
 const W=$(aWins?'cA':'cB'),Lz=$(aWins?'cB':'cA');W.classList.add('win');Lz.classList.add('lose');
 const P=$('c'+k);if(!instant)P.classList.add(ok?'good':'bad');const st=P.querySelector('.stamp');const list=ok?S.ok:S.no;st.textContent=list[(run.streak+run.hist.length)%list.length];st.className='stamp '+(ok?'ok':'no')+' on';
 for(const [kk,c] of[['A',a],['B',b]]){const el=$('c'+kk);if(el.querySelector('.src'))continue;const l=document.createElement('a');l.className='src';l.href=c.u;l.target='_blank';l.rel='noopener';l.textContent=S.src;l.setAttribute('aria-label',S.srcL+' — '+txt(c).c);el.appendChild(l)}
 $('quip').className='quip';$('quip').textContent=(ok?'':'✗ ')+quip(a,b);$('game').classList.remove('wait');
 if(!instant){beep(ok?880:150,.12);const f=$('flash');f.className='flash';void f.offsetWidth;f.className='flash '+(ok?'ok':'no')}
 $('next').textContent=ok?S.next:(L==='en'?'RESULTS':'看結果');$('next').focus({preventScroll:true});bests()}
function next(){if(!run||!run.picked||busy)return;if(!run.ok){endScreen();return}
 const champ=run.b;run.a=champ;run.picked=null;run.ok=null;run.b=challenger(champ,run.streak,run.R,run.seen);if(!run.b){endScreen();return}run.seen.add(run.b.id);run.ids.push(run.b.id);save();paint()}
function endScreen(relang){const S=t();show('end');if(!relang)localStorage.removeItem('dtc_run');
 $('endMode').textContent=run.mode==='daily'?S.dailyOn(today()):S.endless;$('endScore').textContent=run.streak;$('endRank').textContent=S.rank(run.streak);
 $('endGrid').textContent='⚖️'+run.hist.map(x=>x?'🟩':'🟥').join('');
 const a=run.a,b=run.b,big=val(a)>val(b)?a:b,small=big===a?b:a;
 $('loss').innerHTML=`<b>${S.lossT}</b><div class="row"><span>${esc(txt(big).c)}</span><span>${esc(fmt(big))}</span></div><div class="row"><span>${esc(txt(small).c)}</span><span>${esc(fmt(small))}</span></div>`;
 $('shareBtn').focus({preventScroll:true});bests()}
async function share(){const S=t(),mode=run.mode==='daily'?S.dailyOn(today()):S.endless;const url='https://liyun-li.github.io/do-the-crime/'+(L==='en'?'':'?lang=zh');
 const txtS=S.shareT(run.streak,mode)+'\n⚖️'+run.hist.map(x=>x?'🟩':'🟥').join('');
 try{if(navigator.share){await navigator.share({text:txtS,url});return}}catch(e){if(e&&e.name==='AbortError')return}
 try{await navigator.clipboard.writeText(txtS+'\n'+url);$('shareBtn').textContent=L==='en'?'COPIED ✓':'已複製 ✓';setTimeout(()=>$('shareBtn').textContent=S.share,1600)}catch(e){prompt('',txtS+'\n'+url)}}
function seenList(){const S=t(),by=Object.fromEntries(D.cases.map(c=>[c.id,c]));$('dlgB').innerHTML=run.ids.map(id=>by[id]).filter(Boolean).map(c=>`<li><b>${esc(fmt(c))}</b> — ${esc(txt(c).c)} <a href="${esc(c.u)}" target="_blank" rel="noopener">${S.src}</a></li>`).join('');
 $('dlg').showModal();history.pushState({dlg:1},'')}
async function start(mode){if(!await load())return;newRun(mode);show('game');paint()}
async function resume(){const s=JSON.parse(localStorage.getItem('dtc_run')||'null');if(!s||(s.mode==='daily'&&s.day!==today()))return false;if(!await load())return false;
 const by=Object.fromEntries(D.cases.map(c=>[c.id,c]));
 if(s.mode==='daily'){newRun('daily');while(run.ids.length<s.ids.length){const c=challenger(run.b,run.ids.length-1,run.R,run.seen);if(!c)break;run.a=run.b;run.b=c;run.seen.add(c.id);run.ids.push(c.id)}
  if(run.ids.join()!==s.ids.join())return false;run.streak=s.streak;run.hist=s.hist;show('game');paint();return true}
 POOL=poolFor(s.mode);const ids=s.ids.filter(i=>by[i]);if(ids.length<2)return false;
 run={mode:s.mode,seed:s.seed,R:rng(s.seed+':'+ids.length),a:by[ids[ids.length-2]],b:by[ids[ids.length-1]],streak:s.streak,seen:new Set(ids),hist:s.hist,picked:null,ids};
 show('game');paint();return true}
// ---------- events ----------
$('pA').onclick=()=>choose('A');$('pB').onclick=()=>choose('B');$('next').onclick=next;
$('goBtn').onclick=()=>start('endless');$('dailyBtn').onclick=()=>start('daily');$('retryBtn').onclick=()=>start(run?run.mode:'endless');
$('againBtn').onclick=()=>start(run&&run.mode==='daily'?'endless':'endless');$('shareBtn').onclick=share;$('seenBtn').onclick=seenList;
$('dlgX').onclick=()=>history.back();$('dlg').addEventListener('close',()=>{if(history.state&&history.state.dlg)history.back()});
addEventListener('popstate',()=>{if($('dlg').open)$('dlg').close()});
$('home').onclick=()=>{show('start');bests()};
$('langBtn').onclick=()=>{L=L==='en'?'zh-Hant':'en';localStorage.setItem('dtc_lang',L);
 if(run&&$('game').classList.contains('on')&&run.mode==='endless'&&L!=='en'&&(!run.a.zc||!run.b.zc)){/* untranslated pair: keep going, text falls back to English */}
 applyLang()};
$('snd').onclick=()=>{sound=!sound;localStorage.setItem('dtc_snd',sound?'1':'0');$('snd').textContent=sound?'🔊':'🔇';$('snd').setAttribute('aria-pressed',sound);if(sound)beep(660,.06)};
addEventListener('keydown',e=>{if($('dlg').open||!$('game').classList.contains('on'))return;if(e.key==='1'||e.key==='ArrowUp'||e.key==='ArrowLeft')choose('A');else if(e.key==='2'||e.key==='ArrowDown'||e.key==='ArrowRight')choose('B');else if((e.key==='Enter'||e.key===' ')&&run&&run.picked&&document.activeElement===document.body)next()});
L=pickLang();$('snd').textContent=sound?'🔊':'🔇';$('snd').setAttribute('aria-pressed',sound);applyLang();resume();
</script>
</body></html>
